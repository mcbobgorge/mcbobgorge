# Site-wide settings. Currently informational; index.html/about.html/style.css
# are copied from templates/ verbatim by build.py since their copy rarely
# changes. If that copy needs to vary per-build, wire these values into
# templates/index.html and templates/about.html with string.Template ($title
# etc.) and have build.py pass them through.
title = "Nate Wooding"
url = "https://natewooding.com"
description = "Coconut water reviews and other things."

# Intro paragraph on best-coconut-water.html. Plain text or inline HTML.
best_page_intro = "I have bought and scored every coconut water below, paid for out of my own pocket. They are ranked by overall score, best at the top. My reviews are not scientific but if you click on the individual reviews you can learn a bit more about my thought process."

# Google Analytics 4 measurement ID, e.g. "G-ABC1234XYZ". Leave empty to ship no
# analytics at all: the snippet is only added when this has a value, so clearing
# this line removes tracking from every page on the next build.
ga_measurement_id = "G-GHB7P7N0ML"
