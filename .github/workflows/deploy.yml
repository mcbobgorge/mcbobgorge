name: Build and deploy

on:
  push:
    branches: [main]
  workflow_dispatch: {}
  # Weekly rebuild so date-derived text (Nate's age on the About page) stays
  # correct in the served HTML, not only in the browser.
  schedule:
    - cron: "17 9 * * 1"

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Build site
        run: python3 build.py --out _site

      - name: Run tests
        run: python3 -m unittest discover -s tests

      - name: Check the built site
        run: python3 tools/check_site.py _site

      - name: Check CNAME and robots.txt made it into the artifact
        run: |
          test -f _site/CNAME
          test -f _site/robots.txt

      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4

  indexnow:
    # Tell Bing (and other IndexNow engines) the pages changed. Skipped on the weekly rebuild.
    needs: deploy
    if: github.event_name != 'schedule'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Submit sitemap URLs to IndexNow
        run: |
          python3 build.py --out _site > /dev/null
          python3 tools/indexnow.py _site > body.json
          curl -sS -o /dev/null -w "IndexNow HTTP %{http_code}\n" -X POST https://api.indexnow.org/indexnow \
            -H "Content-Type: application/json; charset=utf-8" --data @body.json
