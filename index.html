      // ============ STATE MANAGEMENT ============
      const STORAGE_KEY = 'descent_rhizome_final';
      let stats = { hope:0, grief:0, curiosity:0, surrender:0, depth:0, time:0, visits:0 };
      let journal = [];
      let currentNodeId = 'start';
      let lastNodeId = null;
      let blockCounter = 0;
      let visitedNodes = new Set();
      let densityMode = 'sparse';
      let audioCtx, oscillators=[], noiseNode, noiseGain;
      let ambientProfile = 'default';

      function loadState() {
        try {
          const saved = JSON.parse(localStorage.getItem(STORAGE_KEY));
          if (saved) {
            stats = saved.stats;
            journal = saved.journal || [];
            currentNodeId = saved.currentNode || 'start';
            lastNodeId = saved.lastNodeId || null;
            blockCounter = saved.blockCounter || 0;
            visitedNodes = new Set(saved.visitedNodes || []);
            densityMode = saved.densityMode || 'sparse';
            return;
          }
        } catch(e) {}
        stats = { hope:0, grief:0, curiosity:0, surrender:0, depth:0, time:0, visits:0 };
        journal = [];
        currentNodeId = 'start';
        lastNodeId = null;
        blockCounter = 0;
        visitedNodes = new Set();
        densityMode = 'sparse';
      }
      function saveState() {
        stats.visits++;
        const data = {
          stats, journal, currentNode: currentNodeId, lastNodeId,
          blockCounter, visitedNodes: Array.from(visitedNodes), densityMode
        };
        localStorage.setItem(STORAGE_KEY, JSON.stringify(data));
      }
      loadState();
      saveState();

      // ============ AUDIO SYSTEM ============
      function initAudio() {
        if (audioCtx) return;
        audioCtx = new (window.AudioContext || window.webkitAudioContext)();
        const masterGain = audioCtx.createGain();
        masterGain.gain.value = 0.04;
        masterGain.connect(audioCtx.destination);
        const baseFreq = 40;
        [0, -5, 7, -12].forEach(det => {
          const osc = audioCtx.createOscillator();
          osc.type = 'sine';
          osc.frequency.value = baseFreq * Math.pow(2, det/12);
          const oscGain = audioCtx.createGain();
          oscGain.gain.value = 0.2;
          osc.connect(oscGain);
          oscGain.connect(masterGain);
          osc.start();
          oscillators.push({ osc, gain: oscGain });
        });
        const bufferSize = 4 * audioCtx.sampleRate;
        const noiseBuffer = audioCtx.createBuffer(1, bufferSize, audioCtx.sampleRate);
        const data = noiseBuffer.getChannelData(0);
        for (let i = 0; i < bufferSize; i++) data[i] = Math.random() * 2 - 1;
        noiseNode = audioCtx.createBufferSource();
        noiseNode.buffer = noiseBuffer;
        noiseNode.loop = true;
        const noiseFilter = audioCtx.createBiquadFilter();
        noiseFilter.type = 'lowpass';
        noiseFilter.frequency.value = 200;
        noiseGain = audioCtx.createGain();
        noiseGain.gain.value = 0.01;
        noiseNode.connect(noiseFilter);
        noiseFilter.connect(noiseGain);
        noiseGain.connect(masterGain);
        noiseNode.start();
      }
      function setAmbient(nodeId) {
        switch(nodeId) {
          case 'musicRoom': case 'radioDial': ambientProfile = 'melodic'; break;
          case 'deepStairs': case 'deeperDark': ambientProfile = 'subbass'; break;
          case 'voidGarden': case 'exploreGarden': ambientProfile = 'birds'; break;
          case 'whiteSpace': ambientProfile = 'silence'; break;
          default: ambientProfile = 'default';
        }
      }
      function updateAudio() {
        if (!audioCtx) return;
        const hopeFactor = stats.hope * 0.005;
        const griefFactor = stats.grief * 0.01;
        oscillators.forEach((item, i) => {
          const detune = (hopeFactor - griefFactor) * (i%2===0?1:-1) * 5;
          item.osc.frequency.value = 40 * Math.pow(2, detune/12) + Math.sin(Date.now()/3000)*0.5;
        });
        if (noiseGain) {
          let nv = 0.005 + griefFactor*0.05;
          if (ambientProfile === 'subbass') nv += 0.03;
          if (ambientProfile === 'silence') nv = 0;
          noiseGain.gain.value = nv;
        }
      }

      // ============ LIVING SVG SYSTEM ============
      function seededRandom(seed) {
        let s = seed;
        return function() {
          s = (s * 16807 + 0) % 2147483647;
          return (s - 1) / 2147483646;
        };
      }

      function generateSVG(depth) {
        const seed = Date.now() + depth * 1000 + Math.random() * 1000;
        const rand = seededRandom(seed);
        const style = selectStyle(depth, rand);
        let svgContent = '';
        
        switch(style.type) {
          case 'organic-branches': svgContent = generateOrganicBranches(depth, rand); break;
          case 'pulsing-circles': svgContent = generatePulsingCircles(depth, rand); break;
          case 'creeping-vines': svgContent = generateCreepingVines(depth, rand); break;
          case 'ghost-geometry': svgContent = generateGhostGeometry(depth, rand); break;
          case 'seed-sprouts': svgContent = generateSeedSprouts(depth, rand); break;
          case 'neural-mesh': svgContent = generateNeuralMesh(depth, rand); break;
          case 'floating-fragments': svgContent = generateFloatingFragments(depth, rand); break;
          case 'breathing-lattice': svgContent = generateBreathingLattice(depth, rand); break;
          default: svgContent = generateOrganicBranches(depth, rand);
        }
        
        return `<svg viewBox="0 0 500 350" xmlns="http://www.w3.org/2000/svg" style="animation: ${style.animation} ${style.animDuration}s ease-in-out infinite;">
          <defs>
            <filter id="glow-${seed}">
              <feGaussianBlur stdDeviation="2" result="blur"/>
              <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
            </filter>
            <radialGradient id="grad-${seed}" cx="50%" cy="50%" r="50%">
              <stop offset="0%" stop-color="rgba(180,180,180,0.15)"/>
              <stop offset="100%" stop-color="rgba(0,0,0,0)"/>
            </radialGradient>
          </defs>
          <rect width="500" height="350" fill="url(#grad-${seed})" opacity="0.3"/>
          <g style="animation: ${style.innerAnimation || 'breathe'} ${style.innerDuration || 8}s ease-in-out infinite;">
            ${svgContent}
          </g>
        </svg>`;
      }

      function selectStyle(depth, rand) {
        const roll = rand();
        const styles = [];
        if (depth < 15) {
          styles.push(
            { type: 'seed-sprouts', animation: 'breathe', animDuration: 6, innerAnimation: 'seed-sprout', innerDuration: 12 },
            { type: 'floating-fragments', animation: 'drift-slow', animDuration: 10, innerAnimation: 'ghost-move', innerDuration: 15 },
            { type: 'organic-branches', animation: 'breathe', animDuration: 8, innerAnimation: 'writhe', innerDuration: 12 }
          );
        } else if (depth < 30) {
          styles.push(
            { type: 'organic-branches', animation: 'writhe', animDuration: 10, innerAnimation: 'breathe', innerDuration: 8 },
            { type: 'pulsing-circles', animation: 'pulse', animDuration: 6, innerAnimation: 'flicker', innerDuration: 4 },
            { type: 'creeping-vines', animation: 'breathe', animDuration: 10, innerAnimation: 'vine-grow', innerDuration: 20 },
            { type: 'breathing-lattice', animation: 'breathe', animDuration: 8, innerAnimation: 'pulse', innerDuration: 6 }
          );
        } else if (depth < 50) {
          styles.push(
            { type: 'ghost-geometry', animation: 'ghost-move', animDuration: 15, innerAnimation: 'writhe', innerDuration: 10 },
            { type: 'neural-mesh', animation: 'pulse', animDuration: 7, innerAnimation: 'breathe', innerDuration: 9 },
            { type: 'creeping-vines', animation: 'writhe', animDuration: 12, innerAnimation: 'vine-grow', innerDuration: 25 },
            { type: 'organic-branches', animation: 'writhe', animDuration: 10, innerAnimation: 'creep', innerDuration: 30 }
          );
        } else {
          styles.push(
            { type: 'ghost-geometry', animation: 'ghost-move', animDuration: 12, innerAnimation: 'flicker', innerDuration: 3 },
            { type: 'neural-mesh', animation: 'pulse', animDuration: 5, innerAnimation: 'writhe', innerDuration: 8 },
            { type: 'breathing-lattice', animation: 'breathe', animDuration: 6, innerAnimation: 'pulse', innerDuration: 4 },
            { type: 'pulsing-circles', animation: 'flicker', animDuration: 3, innerAnimation: 'expand', innerDuration: 8 }
          );
        }
        return styles[Math.floor(roll * styles.length)];
      }

      function generateOrganicBranches(depth, rand) {
        let paths = '';
        const branches = Math.floor(5 + depth * 0.3 + rand() * 8);
        const colors = ['rgba(140,140,150,0.4)','rgba(160,150,140,0.35)','rgba(130,160,150,0.3)','rgba(150,140,160,0.38)'];
        function branch(x, y, len, angle, level, maxLevel, color) {
          if (level > maxLevel || len < 3) return;
          const x2 = x + len * Math.cos(angle);
          const y2 = y + len * Math.sin(angle);
          const strokeWidth = Math.max(0.3, (maxLevel - level) * 0.4);
          const opacity = 0.15 + (level / maxLevel) * 0.35;
          paths += `<line x1="${x}" y1="${y}" x2="${x2}" y2="${y2}" stroke="${color}" stroke-width="${strokeWidth}" opacity="${opacity}" style="animation: creep ${15 + rand()*20}s linear infinite; stroke-dasharray: ${len*2}; stroke-dashoffset: ${rand()*1000};"/>`;
          if (rand() < 0.8 && level < maxLevel) branch(x2, y2, len * (0.65 + rand() * 0.15), angle - (0.3 + rand() * 0.6), level + 1, maxLevel, color);
          if (rand() < 0.7 && level < maxLevel) branch(x2, y2, len * (0.6 + rand() * 0.2), angle + (0.3 + rand() * 0.6), level + 1, maxLevel, color);
          if (rand() < 0.2 && level < maxLevel - 1) branch(x2, y2, len * 0.5, angle + (rand() - 0.5) * 1.5, level + 2, maxLevel, color);
        }
        for (let i = 0; i < branches; i++) {
          const x = 100 + rand() * 300, y = 250 + rand() * 80, len = 30 + rand() * 80;
          const angle = -Math.PI/2 + (rand() - 0.5) * 0.8;
          const maxLevel = 3 + Math.floor(rand() * (5 + depth * 0.05));
          branch(x, y, len, angle, 0, maxLevel, colors[Math.floor(rand() * colors.length)]);
        }
        for (let i = 0; i < depth * 0.3; i++) {
          if (rand() < 0.3) paths += `<circle cx="${rand()*500}" cy="${rand()*350}" r="${1 + rand()*3}" fill="rgba(180,180,180,0.3)" style="animation: flicker ${2 + rand()*5}s ease-in-out infinite;"/>`;
        }
        return paths;
      }

      function generatePulsingCircles(depth, rand) {
        let circles = '';
        const count = Math.floor(8 + depth * 0.4 + rand() * 15);
        for (let i = 0; i < count; i++) {
          const cx = rand() * 500, cy = rand() * 350, r = 3 + rand() * 40;
          const opacity = 0.1 + rand() * 0.4, delay = rand() * 5, duration = 3 + rand() * 10;
          circles += `<circle cx="${cx}" cy="${cy}" r="${r}" fill="none" stroke="rgba(160,160,170,${opacity})" stroke-width="${0.3 + rand() * 1.5}" style="animation: pulse ${duration}s ease-in-out ${delay}s infinite, expand ${duration*2}s ease-in-out ${delay}s infinite;"/>`;
          if (rand() < 0.4) circles += `<circle cx="${cx}" cy="${cy}" r="${r * 0.3}" fill="rgba(200,200,210,${opacity * 0.6})" style="animation: flicker ${3 + rand()*4}s ease-in-out ${delay}s infinite;"/>`;
        }
        return circles;
      }

      function generateCreepingVines(depth, rand) {
        let vines = '';
        const vineCount = 3 + Math.floor(rand() * 5);
        for (let v = 0; v < vineCount; v++) {
          let path = '', cx = rand() * 400 + 50, cy = 300 + rand() * 50;
          const segments = 5 + Math.floor(rand() * 15);
          const color = ['rgba(140,160,140,0.5)','rgba(160,150,130,0.45)','rgba(130,170,150,0.4)'][Math.floor(rand() * 3)];
          path += `M ${cx} ${cy}`;
          for (let s = 0; s < segments; s++) {
            cx += (rand() - 0.5) * 60; cy -= 15 + rand() * 30;
            path += ` Q ${cx + (rand()-0.5)*30} ${cy + (rand()-0.5)*20} ${cx} ${cy}`;
          }
          vines += `<path d="${path}" fill="none" stroke="${color}" stroke-width="${0.5 + rand() * 2}" style="animation: vine-grow ${15 + rand()*20}s ease-in-out ${rand()*5}s infinite; stroke-dasharray: ${300 + rand()*500};"/>`;
          for (let s = 0; s < segments; s++) {
            if (rand() < 0.4) vines += `<circle cx="${cx + (rand()-0.5)*20}" cy="${cy + (rand()-0.5)*15}" r="${1 + rand()*3}" fill="rgba(180,200,180,0.4)" style="animation: flicker ${4 + rand()*6}s ease-in-out infinite;"/>`;
          }
        }
        return vines;
      }

      function generateGhostGeometry(depth, rand) {
        let shapes = '';
        const count = 4 + Math.floor(rand() * 8);
        const polygonPoints = (sides, cx, cy, r) => {
          let points = '';
          for (let i = 0; i < sides; i++) {
            const angle = (i / sides) * Math.PI * 2 - Math.PI/2;
            points += `${cx + r * Math.cos(angle)},${cy + r * Math.sin(angle)} `;
          }
          return points;
        };
        for (let i = 0; i < count; i++) {
          const cx = 100 + rand() * 300, cy = 50 + rand() * 250;
          const sides = 3 + Math.floor(rand() * 6), r = 10 + rand() * 60;
          const opacity = 0.15 + rand() * 0.35, delay = rand() * 4;
          shapes += `<polygon points="${polygonPoints(sides, cx, cy, r)}" fill="none" stroke="rgba(170,170,180,${opacity})" stroke-width="${0.3 + rand() * 1}" style="animation: ghost-move ${8 + rand()*15}s ease-in-out ${delay}s infinite, flicker ${3 + rand()*5}s ease-in-out ${delay}s infinite;"/>`;
          if (rand() < 0.6) shapes += `<polygon points="${polygonPoints(sides, cx, cy, r * 0.6)}" fill="none" stroke="rgba(200,200,200,${opacity * 0.5})" stroke-width="0.3" style="animation: ghost-move ${6 + rand()*10}s ease-in-out ${delay + 1}s infinite;"/>`;
        }
        return shapes;
      }

      function generateSeedSprouts(depth, rand) {
        let sprouts = '';
        const count = 5 + Math.floor(rand() * 12);
        for (let i = 0; i < count; i++) {
          const x = 80 + rand() * 340, baseY = 280 + rand() * 60;
          const height = 20 + rand() * 120, width = 3 + rand() * 8, delay = rand() * 6;
          const color = ['rgba(150,180,150,0.5)','rgba(180,160,140,0.45)','rgba(140,180,160,0.5)'][Math.floor(rand() * 3)];
          sprouts += `<rect x="${x - width/2}" y="${baseY - height}" width="${width}" height="${height}" fill="${color}" rx="2" style="animation: seed-sprout ${8 + rand()*12}s ease-out ${delay}s infinite; transform-origin: ${x}px ${baseY}px;"/>`;
          sprouts += `<circle cx="${x}" cy="${baseY - height}" r="${width * 0.8}" fill="rgba(200,200,210,0.5)" style="animation: pulse ${3 + rand()*5}s ease-in-out ${delay}s infinite;"/>`;
          if (rand() < 0.5) {
            const leafY = baseY - height * (0.3 + rand() * 0.5);
            sprouts += `<ellipse cx="${x + width}" cy="${leafY}" rx="${width*1.5}" ry="${width*0.6}" fill="rgba(170,200,170,0.35)" style="animation: flicker ${4 + rand()*4}s ease-in-out infinite;"/>`;
            sprouts += `<ellipse cx="${x - width}" cy="${leafY}" rx="${width*1.5}" ry="${width*0.6}" fill="rgba(170,200,170,0.35)" style="animation: flicker ${4 + rand()*4}s ease-in-out ${delay + 1}s infinite;"/>`;
          }
        }
        return sprouts;
      }

      function generateNeuralMesh(depth, rand) {
        let mesh = '';
        const nodes = [];
        const nodeCount = 8 + Math.floor(depth * 0.3 + rand() * 10);
        for (let i = 0; i < nodeCount; i++) nodes.push({ x: 80 + rand() * 340, y: 30 + rand() * 290, r: 1 + rand() * 4, pulse: 2 + rand() * 6 });
        for (let i = 0; i < nodes.length; i++) {
          for (let j = i + 1; j < nodes.length; j++) {
            if (rand() < 0.35) mesh += `<line x1="${nodes[i].x}" y1="${nodes[i].y}" x2="${nodes[j].x}" y2="${nodes[j].y}" stroke="rgba(150,150,170,${0.1 + rand()*0.2})" stroke-width="0.3" style="animation: flicker ${4 + rand()*8}s ease-in-out ${rand()*3}s infinite;"/>`;
          }
        }
        nodes.forEach(node => { mesh += `<circle cx="${node.x}" cy="${node.y}" r="${node.r}" fill="rgba(180,180,190,0.5)" style="animation: pulse ${node.pulse}s ease-in-out ${rand()*3}s infinite;"/>`; });
        return mesh;
      }

      function generateFloatingFragments(depth, rand) {
        let fragments = '';
        const count = 10 + Math.floor(rand() * 20);
        for (let i = 0; i < count; i++) {
          const x = rand() * 500, y = rand() * 350, w = 2 + rand() * 15, h = 0.5 + rand() * 3;
          const angle = rand() * 360, opacity = 0.2 + rand() * 0.4, delay = rand() * 5;
          fragments += `<rect x="${x}" y="${y}" width="${w}" height="${h}" fill="rgba(180,180,190,${opacity})" transform="rotate(${angle} ${x} ${y})" style="animation: ghost-move ${6 + rand()*12}s ease-in-out ${delay}s infinite, flicker ${2 + rand()*4}s ease-in-out ${delay}s infinite;"/>`;
          if (rand() < 0.3) fragments += `<circle cx="${x + w/2}" cy="${y}" r="${h * 2}" fill="rgba(200,200,200,${opacity * 0.6})" style="animation: pulse ${3 + rand()*5}s ease-in-out ${delay}s infinite;"/>`;
        }
        return fragments;
      }

      function generateBreathingLattice(depth, rand) {
        let lattice = '';
        const spacing = 20 + rand() * 40;
        const rows = 3 + Math.floor(350 / spacing);
        const cols = 3 + Math.floor(500 / spacing);
        for (let r = 0; r < rows; r++) {
          for (let c = 0; c < cols; c++) {
            const x = c * spacing + rand() * 10, y = r * spacing + rand() * 10;
            const opacity = 0.15 + rand() * 0.3, delay = (r + c) * 0.2, d = spacing * 0.3;
            lattice += `<polygon points="${x},${y-d} ${x+d},${y} ${x},${y+d} ${x-d},${y}" fill="none" stroke="rgba(160,160,180,${opacity})" stroke-width="0.4" style="animation: pulse ${4 + rand()*4}s ease-in-out ${delay}s infinite;"/>`;
            if (rand() < 0.3) lattice += `<circle cx="${x}" cy="${y}" r="${d * 0.3}" fill="rgba(190,190,200,${opacity * 0.8})" style="animation: flicker ${3 + rand()*3}s ease-in-out ${delay}s infinite;"/>`;
          }
        }
        return lattice;
      }

      function generateMapSVG() {
        let paths = '';
        const allNodes = Array.from(visitedNodes);
        const positions = {};
        allNodes.forEach((id, i) => { positions[id] = { x: 80 + Math.random() * 340, y: 40 + Math.random() * 270 }; });
        allNodes.forEach((id, i) => {
          if (i > 0) {
            const prev = allNodes[i-1];
            paths += `<line x1="${positions[prev].x}" y1="${positions[prev].y}" x2="${positions[id].x}" y2="${positions[id].y}" stroke="rgba(200,200,200,0.3)" stroke-width="0.5" style="animation: creep ${10 + Math.random()*15}s linear infinite; stroke-dasharray: 200;"/>`;
          }
        });
        allNodes.forEach(id => {
          const p = positions[id];
          paths += `<circle cx="${p.x}" cy="${p.y}" r="3" fill="#888" style="animation: pulse ${3 + Math.random()*4}s ease-in-out infinite;"/>`;
          paths += `<text x="${p.x+5}" y="${p.y+5}" fill="#aaa" font-size="6" style="animation: flicker 4s ease-in-out infinite;">${id.substring(0,8)}</text>`;
        });
        return `<svg viewBox="0 0 500 350" xmlns="http://www.w3.org/2000/svg" style="animation: breathe 8s ease-in-out infinite;">${paths}</svg>`;
      }

      // ============ VISUAL EFFECTS ============
      function updateBodyDepthClass() {
        document.body.classList.remove('depth-medium','depth-deep','depth-verydeep');
        if (stats.depth > 70) document.body.classList.add('depth-verydeep');
        else if (stats.depth > 40) document.body.classList.add('depth-deep');
        else if (stats.depth > 15) document.body.classList.add('depth-medium');
        document.body.classList.remove('layout-narrow','layout-wide','layout-split','layout-scattered');
        if (stats.depth > 50 && Math.random()<0.2) document.body.classList.add('layout-scattered');
        else if (stats.depth > 30 && Math.random()<0.15) document.body.classList.add('layout-split');
        else if (stats.depth > 20 && Math.random()<0.1) document.body.classList.add('layout-wide');
      }
      function glitchOverlay() {
        const overlay = document.getElementById('glitch-overlay');
        overlay.classList.add('active');
        setTimeout(()=> overlay.classList.remove('active'), 200);
      }
      function applyMutations(block, depth) {
        const textEl = block.querySelector('.text');
        if (!textEl) return;
        if (depth < 15) return;
        const roll = Math.random();
        if (depth > 60 && roll < 0.4) { textEl.classList.add('glitch'); glitchOverlay(); }
        else if (depth > 45 && roll < 0.35) textEl.classList.add('mirror');
        else if (depth > 30 && roll < 0.3) textEl.classList.add('rotate');
        else if (depth > 20 && roll < 0.25) textEl.classList.add('faint');
        else if (depth > 55 && roll < 0.15) textEl.classList.add('shiver');
        else if (depth > 65 && roll < 0.2) textEl.classList.add('rotate-strong');
        if (depth > 40 && Math.random()<0.12) block.classList.add('horizontal');
        if (depth > 35 && Math.random()<0.1) block.classList.add('floating');
        if (depth > 25 && Math.random()<0.08) block.classList.add('overlapping');
        if (Math.random() < 0.2) {
          const svg = block.querySelector('.svg-container svg');
          if (svg) {
            const animations = ['breathe','writhe','pulse','ghost-move','drift-slow'];
            const anim = animations[Math.floor(Math.random() * animations.length)];
            svg.style.animation = `${anim} ${6 + Math.random()*15}s ease-in-out infinite`;
          }
        }
      }

      // ============ OVERLAYS ============
      function spawnHall() {
        if(stats.depth<10)return;
        const msgs = ["memory leak detected","you already read this paragraph","the hallway is learning your shape","there is a door here that wasn't there before","the page remembers you","the building is breathing"];
        const el = document.createElement('div'); el.className='hall';
        el.textContent=msgs[Math.floor(Math.random()*msgs.length)];
        el.style.left=(Math.random()*(window.innerWidth-200))+'px';
        el.style.top=(Math.random()*(window.innerHeight-100))+'px';
        document.body.appendChild(el);
        setTimeout(()=>el.remove(),14000+Math.random()*6000);
      }
      function showMemories() {
        if(journal.length<5)return;
        const recent=journal.slice(-10);
        for(let i=0;i<3;i++){
          const frag=recent[Math.floor(Math.random()*recent.length)];
          const el=document.createElement('div'); el.className='memory-fragment';
          el.textContent=frag;
          el.style.left=(Math.random()*(window.innerWidth-280))+'px';
          el.style.top=(Math.random()*(window.innerHeight-120))+'px';
          document.body.appendChild(el);
          setTimeout(()=>el.remove(),18000+Math.random()*10000);
        }
      }
      function updateMargin() {
        const marginDiv = document.getElementById('margin');
        if (!marginDiv) return;
        if (stats.depth > 5 && !marginDiv.classList.contains('active')) marginDiv.classList.add('active');
        const annotations = marginDiv.querySelectorAll('.annotation');
        if (annotations.length > 8) annotations[0].remove();
        const entry = journal[journal.length-1];
        if (entry) {
          const ann = document.createElement('div'); ann.className='annotation';
          const snippet = entry.substring(0, 80) + '...';
          if (Math.random() < 0.35) {
            ann.innerHTML = `<a href="#" class="margin-link">${snippet}</a>`;
            ann.querySelector('.margin-link').addEventListener('click', (e)=>{ e.preventDefault(); goToNode('metacommentary'); });
          } else {
            ann.textContent = snippet;
          }
          marginDiv.appendChild(ann);
          marginDiv.scrollTop = marginDiv.scrollHeight;
        }
      }

      // ============ HOTWORDS ============
      function addHotwords(block) {
        const textEl = block.querySelector('.text');
        if (!textEl) return;
        const hotwords = {
          'garden': 'secretGarden', 'static': 'whiteSpace', 'morning': 'pushDoor',
          'honey': 'secretGarden', 'hallway': 'mapRoom', 'darkness': 'darkHallway',
          'stairs': 'staircaseDown', 'window': 'windowField', 'door': 'doorNoHandle',
          'silence': 'silenceRoom', 'library': 'unknownDoor'
        };
        let html = textEl.innerHTML;
        for (let [word, nodeId] of Object.entries(hotwords)) {
          const regex = new RegExp(`\\b${word}\\b`, 'gi');
          html = html.replace(regex, `<span class="hotword" data-goto="${nodeId}">${word}</span>`);
        }
        textEl.innerHTML = html;
        textEl.querySelectorAll('.hotword').forEach(span => {
          span.addEventListener('click', (e) => { e.stopPropagation(); goToNode(span.dataset.goto); });
        });
      }

      // ============ THRESHOLD-BASED CHOICES ============
      function getChoicesForNode(node) {
        let choices = JSON.parse(JSON.stringify(node.choices || []));
        if (stats.grief > 25) choices = choices.filter(c => c.stat !== 'hope');
        if (stats.hope > 30 && Math.random() < 0.35) {
          choices.push({ label: 'a door of light appears', next: 'voidGarden', stat:'hope', statInc:3, flight:true });
        }
        if (stats.surrender > 20 && Math.random() < 0.3) {
          choices.push({ label: 'the floor opens beneath you', next: 'fallDirection', stat:'surrender', statInc:2, flight:true });
        }
        if (Math.random() < 0.12) {
          choices.push({ label: 'do not click this', next: 'metacommentary', special:true });
        }
        return choices;
      }

      // ============ CORE NAVIGATION ============
      function goToNode(nodeId) {
        const node = nodes[nodeId];
        if (!node) { console.warn('missing node:', nodeId); return; }
        let text = node.defaultText || '';
        if (node.textVariants && lastNodeId && node.textVariants[lastNodeId]) text = node.textVariants[lastNodeId];
        if (nodeId === 'metacommentary') text = `You have been here for ${stats.depth} steps. Your hope is ${stats.hope} and your grief is ${stats.grief}. The building wonders if you are still there. It wonders if you ever left. It wonders if the page is reading you.`;
        lastNodeId = currentNodeId;
        currentNodeId = nodeId;
        stats.depth++; stats.time++;
        journal.push(text);
        if (journal.length > 25) journal.shift();
        visitedNodes.add(nodeId);
        saveState();
        setAmbient(nodeId);
        updateBodyDepthClass();

        const main = document.getElementById('main');
        const block = document.createElement('div');
        block.className = 'block';
        block.id = 'block-' + (++blockCounter);
        const isMap = (nodeId === 'mapRoom');
        block.innerHTML = `<div class="text">${text}</div><div class="svg-container">${isMap ? generateMapSVG() : generateSVG(stats.depth)}</div><div class="choices-container"></div>`;
        applyMutations(block, stats.depth);
        document.querySelectorAll('.block').forEach(b => {
          const bId = parseInt(b.id.split('-')[1]);
          if (b.id !== block.id && stats.depth - bId > 6) b.classList.add('past');
        });
        addHotwords(block);
        const choicesContainer = block.querySelector('.choices-container');
        const choices = getChoicesForNode(node);
        if (choices.length > 0) {
          choices.forEach(choice => {
            const btn = document.createElement('button');
            btn.textContent = choice.label;
            if (choice.flight) {
              btn.classList.add('flight');
              const flightBtn = btn;
              setTimeout(() => { if (flightBtn.parentNode) flightBtn.remove(); }, 9000);
            }
            btn.addEventListener('click', () => {
              if (choice.stat && stats[choice.stat] !== undefined) stats[choice.stat] += choice.statInc || 1;
              goToNode(choice.next);
              if (Math.random() < 0.35 && stats.depth > 10) setTimeout(() => goToNode(getRandomNode()), 700);
              if (stats.depth % 10 === 0) showMemories();
              if (Math.random() < 0.5) spawnHall();
              updateMargin();
              if (Math.random() < 0.15) glitchOverlay();
            });
            choicesContainer.appendChild(btn);
          });
        } else {
          const restartBtn = document.createElement('button');
          restartBtn.textContent = 'descend again';
          restartBtn.addEventListener('click', () => {
            stats.depth = 0; journal = [];
            currentNodeId = 'start'; lastNodeId = null;
            visitedNodes.clear(); saveState();
            document.getElementById('main').innerHTML = '';
            document.getElementById('margin').innerHTML = '';
            document.getElementById('margin').classList.remove('active');
            document.body.className = '';
            startJourney();
          });
          choicesContainer.appendChild(restartBtn);
        }
        main.appendChild(block);
        if (stats.depth > 25 && Math.random() < 0.08) setTimeout(() => goToNode('mapRoom'), 2000);
      }

      function getRandomNode() {
        const keys = Object.keys(nodes).filter(k => k !== 'start' && nodes[k].choices && nodes[k].choices.length > 0);
        return keys[Math.floor(Math.random() * keys.length)];
      }

      function startJourney() {
        const main = document.getElementById('main');
        main.innerHTML = '';
        const greeting = stats.visits > 1 ? 'you came back.' : 'you are here now.';
        const h2 = document.createElement('h2');
        h2.textContent = greeting;
        h2.style.marginBottom = '50px';
        h2.style.opacity = '0.8';
        h2.style.fontWeight = 'normal';
        main.appendChild(h2);
        if (journal.length > 0) {
          const memBlock = document.createElement('div');
          memBlock.className = 'block faint';
          memBlock.innerHTML = `<div class="text">${journal.slice(-3).join('<br><br>')}</div>`;
          main.appendChild(memBlock);
        }
        goToNode(currentNodeId);
        document.body.addEventListener('click', () => {
          initAudio();
          if (audioCtx && audioCtx.state === 'suspended') audioCtx.resume();
        }, { once: true });
        setInterval(updateAudio, 2000);
        updateBodyDepthClass();
      }

      startJourney();
    })();
  </script>
</body>
</html>
