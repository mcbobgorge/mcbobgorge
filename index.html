<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>nate wooding</title>
  <style>
    :root {
      --bg: #0a0a0a;
      --text: #c8c8c8;
      --accent: #333;
    }
    * { margin: 0; padding: 0; box-sizing: border-box; }
    html, body {
      background: var(--bg);
      color: var(--text);
      font-family: 'Georgia', 'Times New Roman', serif;
      overflow-x: hidden;
      transition: background 4s, color 4s;
      min-height: 100vh;
      position: relative;
    }
    body {
      padding: 60px 40px;
      transition: padding 3s;
    }
    #main {
      width: 100%;
      max-width: 800px;
      margin: 0 auto;
      position: relative;
      z-index: 2;
    }
    body.layout-narrow #main { max-width: 500px; }
    body.layout-wide #main { max-width: 90vw; }
    body.layout-split #main { 
      display: grid; 
      grid-template-columns: 1fr 1fr; 
      gap: 40px; 
      max-width: 90vw; 
    }
    body.layout-split .block { break-inside: avoid; }
    body.layout-scattered #main {
      display: flex;
      flex-wrap: wrap;
      justify-content: center;
      gap: 30px;
      max-width: 95vw;
    }
    body.layout-scattered .block {
      width: 300px;
      margin: 20px;
      transform: rotate(calc(var(--rot, 0) * 1deg));
    }
    body.depth-medium { background: #0c0c0f; }
    body.depth-deep { background: #0e0a0a; color: #b0b0b0; }
    body.depth-verydeep { background: #050505; color: #999; }
    body.depth-verydeep .text { text-shadow: 0 0 8px rgba(200,200,200,0.1); }

    .block {
      margin: 50px 0;
      opacity: 0;
      transform: translateY(40px);
      animation: fadeIn 1.8s ease forwards;
      transition: all 3s;
      position: relative;
      padding: 20px;
      border-left: 1px solid transparent;
      transition: border-color 2s, background 2s, transform 2s, opacity 2s;
    }
    .block:hover {
      border-left-color: rgba(255,255,255,0.1);
      background: rgba(255,255,255,0.015);
    }
    .block.past {
      opacity: 0.45;
      transform: translateY(0) translateX(8px) scale(0.97);
      filter: blur(0.8px) saturate(0.6);
      border-left-color: rgba(100,100,100,0.15);
    }
    .block.overlapping {
      position: relative;
      z-index: 5;
      margin-top: -30px;
      background: rgba(5,5,5,0.8);
      backdrop-filter: blur(4px);
      border: 1px solid #1a1a1a;
    }
    .block.horizontal {
      white-space: nowrap;
      overflow-x: auto;
      max-width: 85vw;
      padding: 30px 20px;
      border-left: 2px solid #333;
      animation: slideRight 2.5s ease forwards;
    }
    .block.floating {
      position: relative;
      animation: floatBlock 8s ease-in-out infinite;
    }
    @keyframes slideRight {
      0% { transform: translateX(120vw); opacity: 0; }
      100% { transform: translateX(0); opacity: 1; }
    }
    @keyframes floatBlock {
      0%, 100% { transform: translateY(0); }
      50% { transform: translateY(-10px); }
    }
    @keyframes fadeIn {
      to { opacity: 1; transform: translateY(0); }
    }

    .text {
      font-size: 1.15rem;
      line-height: 1.8;
      margin-bottom: 25px;
      transition: all 0.8s;
      letter-spacing: 0.02em;
    }
    .text.glitch {
      animation: glitchText 0.25s infinite alternate;
      color: #d4d4d4;
    }
    @keyframes glitchText {
      0% { transform: translate(2px, 1px) skew(0.5deg); }
      33% { transform: translate(-3px, -1px) skew(-0.8deg); }
      66% { transform: translate(1px, 2px) skew(0.3deg); }
      100% { transform: translate(-2px, -2px) skew(-0.5deg); }
    }
    .text.mirror { transform: scaleX(-1); display: inline-block; }
    .text.rotate { transform: rotate(1.5deg); display: inline-block; }
    .text.rotate-strong { transform: rotate(-3deg); display: inline-block; }
    .text.faint { opacity: 0.35; }
    .text.bold { font-weight: bold; color: #fff; }
    .text.italic { font-style: italic; color: #aaa; }
    .text.shiver { animation: shiver 0.15s infinite; }
    @keyframes shiver {
      0% { transform: translate(0, 0); }
      25% { transform: translate(1px, -1px); }
      50% { transform: translate(-1px, 1px); }
      75% { transform: translate(-1px, -1px); }
      100% { transform: translate(1px, 1px); }
    }

    .hotword {
      cursor: pointer;
      border-bottom: 1px dashed #666;
      transition: all 0.3s;
      position: relative;
    }
    .hotword:hover {
      color: #fff;
      border-bottom-color: #ccc;
      text-shadow: 0 0 6px rgba(255,255,255,0.3);
    }

    .choices-container {
      display: flex;
      flex-wrap: wrap;
      gap: 8px;
      margin-top: 15px;
    }
    button {
      background: #0f0f0f;
      border: 1px solid #2a2a2a;
      color: #aaa;
      padding: 10px 20px;
      cursor: pointer;
      font-family: inherit;
      font-size: 0.9rem;
      transition: all 0.3s;
      text-transform: lowercase;
      letter-spacing: 0.03em;
      border-radius: 2px;
      position: relative;
    }
    button:hover {
      background: #1a1a1a;
      border-color: #555;
      color: #ddd;
    }
    button.flight {
      border: 2px solid #aaa;
      box-shadow: 0 0 12px rgba(200,200,200,0.25);
      animation: pulseFlight 1.5s infinite;
      background: #1a1a1a;
      color: #ddd;
    }
    button.flight:hover {
      box-shadow: 0 0 24px rgba(255,255,255,0.5);
      background: #222;
    }
    @keyframes pulseFlight {
      0%, 100% { box-shadow: 0 0 8px rgba(200,200,200,0.2); }
      50% { box-shadow: 0 0 20px rgba(255,255,255,0.5); }
    }

    .svg-container {
      margin: 30px 0;
      width: 100%;
      overflow: hidden;
      position: relative;
    }
    .svg-container svg {
      width: 100%;
      height: auto;
      max-height: 350px;
      opacity: 0.7;
      transition: opacity 0.5s;
    }
    .block:hover .svg-container svg { opacity: 0.95; }

    @keyframes breathe {
      0%, 100% { transform: scale(1); }
      50% { transform: scale(1.02); }
    }
    @keyframes pulse {
      0%, 100% { opacity: 0.4; }
      50% { opacity: 0.8; }
    }
    @keyframes writhe {
      0% { transform: rotate(0deg) scale(1); }
      25% { transform: rotate(0.5deg) scale(1.01); }
      50% { transform: rotate(0deg) scale(1); }
      75% { transform: rotate(-0.5deg) scale(0.99); }
      100% { transform: rotate(0deg) scale(1); }
    }
    @keyframes drift-slow {
      0% { transform: translate(0, 0); }
      100% { transform: translate(10px, 5px); }
    }
    @keyframes creep {
      0% { stroke-dashoffset: 1000; }
      100% { stroke-dashoffset: 0; }
    }
    @keyframes flicker {
      0%, 100% { opacity: 0.3; }
      33% { opacity: 0.7; }
      66% { opacity: 0.1; }
    }
    @keyframes expand {
      0% { r: 1; opacity: 0.2; }
      100% { r: 15; opacity: 0.8; }
    }
    @keyframes vine-grow {
      0% { stroke-dashoffset: 500; stroke-dasharray: 500; }
      100% { stroke-dashoffset: 0; stroke-dasharray: 500; }
    }
    @keyframes ghost-move {
      0% { transform: translate(0, 0) rotate(0deg); }
      25% { transform: translate(30px, -20px) rotate(5deg); }
      50% { transform: translate(10px, 40px) rotate(-3deg); }
      75% { transform: translate(-20px, 10px) rotate(2deg); }
      100% { transform: translate(0, 0) rotate(0deg); }
    }
    @keyframes seed-sprout {
      0% { transform: scaleY(0); transform-origin: bottom; }
      100% { transform: scaleY(1); transform-origin: bottom; }
    }

    #margin {
      position: fixed;
      right: 20px;
      top: 80px;
      width: 260px;
      height: calc(100vh - 140px);
      overflow-y: auto;
      color: #666;
      font-size: 0.7rem;
      opacity: 0;
      transition: opacity 2s;
      border-left: 1px solid #1a1a1a;
      padding-left: 20px;
      z-index: 20;
      pointer-events: none;
    }
    #margin.active { opacity: 0.75; }
    #margin .annotation {
      margin-bottom: 12px;
      font-style: italic;
      line-height: 1.5;
      pointer-events: auto;
    }
    #margin .annotation a {
      color: #999;
      text-decoration: none;
      border-bottom: 1px dashed #444;
    }
    #margin .annotation a:hover { color: #ccc; }

    .hall {
      position: fixed;
      pointer-events: none;
      opacity: 0.5;
      color: #555;
      font-size: 11px;
      z-index: 10;
      animation: drift-hall 14s linear infinite;
      font-style: italic;
    }
    @keyframes drift-hall {
      0% { transform: translate(0, 0) rotate(0deg); }
      25% { transform: translate(30px, -25px) rotate(1deg); }
      50% { transform: translate(-15px, 30px) rotate(-1deg); }
      75% { transform: translate(-25px, -15px) rotate(0.5deg); }
      100% { transform: translate(0, 0) rotate(0deg); }
    }

    .memory-fragment {
      position: fixed;
      background: rgba(0,0,0,0.75);
      padding: 12px 16px;
      max-width: 280px;
      font-size: 0.8rem;
      opacity: 0.35;
      color: #999;
      z-index: 5;
      animation: memoryFade 18s ease-in-out infinite;
      border: 1px solid rgba(255,255,255,0.05);
      pointer-events: none;
    }
    @keyframes memoryFade {
      0%, 100% { opacity: 0.15; }
      50% { opacity: 0.55; }
    }

    #glitch-overlay {
      position: fixed;
      top: 0; left: 0;
      width: 100%; height: 100%;
      background: rgba(0,0,0,0.8);
      pointer-events: none;
      z-index: 100;
      opacity: 0;
      transition: opacity 0.1s;
    }
    #glitch-overlay.active {
      opacity: 0.6;
      animation: glitchFlash 0.15s;
    }
    @keyframes glitchFlash {
      0% { opacity: 0.8; }
      50% { opacity: 0.2; }
      100% { opacity: 0.6; }
    }

    body::after {
      content: '';
      position: fixed;
      top: 0; left: 0;
      width: 100%; height: 100%;
      background: repeating-linear-gradient(
        0deg,
        transparent,
        transparent 2px,
        rgba(0,0,0,0.03) 2px,
        rgba(0,0,0,0.03) 4px
      );
      pointer-events: none;
      z-index: 999;
    }

    @media (max-width: 1000px) {
      body { padding: 40px 20px; }
      #margin { display: none; }
      body.layout-split #main { grid-template-columns: 1fr; }
    }
  </style>
</head>
<body>
  <div id="glitch-overlay"></div>
  <div id="margin"></div>
  <div id="main"></div>

  <script>
    (function() {
      // ============ COMPLETE NODE DATABASE ============
      const nodes = {
        start: {
          defaultText: "The hallway stretches in both directions, lit by bulbs that remember only half the night. The air is damp with old rain. Somewhere ahead, a radio plays the same three notes over and over.",
          choices: [
            { label: "walk toward the music", next: "musicRoom", stat:'hope', statInc:1 },
            { label: "take the staircase down", next: "staircaseDown", stat:'grief', statInc:1 },
            { label: "sit against the wall", next: "sitWall", stat:'surrender', statInc:1 },
            { label: "examine the door with no handle", next: "doorNoHandle", stat:'curiosity', statInc:2 }
          ]
        },
        musicRoom: {
          textVariants: {
            start: "You follow the three notes into a dusty room. A radio sits on a windowsill that looks out onto a field of static. Under the hiss, a woman's voice repeats: 'we are still here, we are still here.'",
            staircaseDown: "The same three notes drift up from below. You trace them to a room you've seen before: the radio, the windowsill, the static. But the voice is different now—it's your own.",
            darkHallway: "The darkness carries the same three notes. You stumble into the music room, but the windowsill is gone. The radio floats in void, tethered by nothing."
          },
          defaultText: "The radio plays its three notes. The windowsill is empty. The static watches.",
          choices: [
            { label: "turn the dial", next: "radioDial", stat:'hope', statInc:1 },
            { label: "look outside the window", next: "windowField", stat:'curiosity', statInc:1 },
            { label: "shut it off", next: "silenceRoom", stat:'grief', statInc:2 },
            { label: "leave it playing and continue", next: "continueHall", stat:'hope', statInc:0 }
          ]
        },
        radioDial: {
          defaultText: "You twist the dial and the static clears into a voice: 'don't forget the gardens.' The radio flickers, then the voice becomes a child singing a nursery rhyme about a house with too many rooms.",
          choices: [
            { label: "listen closer", next: "nurseryRhyme", stat:'curiosity', statInc:1 },
            { label: "write down the words", next: "writeWords", stat:'surrender', statInc:1 },
            { label: "turn it off", next: "silenceRoom", stat:'grief', statInc:1 }
          ]
        },
        nurseryRhyme: {
          defaultText: "'…and the hallway remembered the shape of every child who ever ran through it, laughing, and the walls grew warm with the memory.' The voice fades, leaving only the hum of the building.",
          choices: [
            { label: "hum along", next: "humAlong", stat:'hope', statInc:1 },
            { label: "turn it off", next: "silenceRoom", stat:'grief', statInc:1 }
          ]
        },
        humAlong: {
          defaultText: "You hum and the radio hums with you. The bulbs brighten for a moment. The hallway feels almost like a home you've been trying to remember.",
          choices: [
            { label: "keep humming", next: "keepHumming", stat:'hope', statInc:1 },
            { label: "stop", next: "silenceRoom", stat:'surrender', statInc:1 }
          ]
        },
        keepHumming: {
          defaultText: "You hum and the hallway hums with you, a harmony of one note. The bulbs glow steady for the first time. You feel the building smile.",
          choices: [
            { label: "continue", next: "continueHall", stat:'hope', statInc:1 }
          ]
        },
        writeWords: {
          defaultText: "You scratch the words onto a scrap of paper. As you write, the ink turns red, then clear. The words become part of your skin.",
          choices: [
            { label: "keep the paper", next: "keepPaper", stat:'surrender', statInc:1 },
            { label: "drop it", next: "continueHall", stat:'grief', statInc:1 }
          ]
        },
        keepPaper: {
          defaultText: "You fold the paper and put it in your pocket. Over time, you'll forget it's there, but it will whisper to you when you sleep.",
          choices: [
            { label: "continue", next: "continueHall", stat:'hope', statInc:0 }
          ]
        },
        windowField: {
          defaultText: "Outside, the field is endless gray static, but in the distance you see a figure walking. It might be waving. The glass is cold under your fingers.",
          choices: [
            { label: "open the window", next: "openWindow", stat:'hope', statInc:2 },
            { label: "call out", next: "callOut", stat:'hope', statInc:1 },
            { label: "turn away", next: "continueHall", stat:'grief', statInc:1 }
          ]
        },
        openWindow: {
          defaultText: "The window opens and the static pours in, but it feels like wind, like the breath of the outside world. You smell rain and asphalt.",
          choices: [
            { label: "climb out", next: "outside", stat:'hope', statInc:3 },
            { label: "just breathe", next: "breatheWindow", stat:'hope', statInc:1 }
          ]
        },
        breatheWindow: {
          defaultText: "You breathe deep. The air tastes of ozone and faraway rain. Somewhere a train horn sounds, impossibly distant. You feel a thread of light inside you.",
          choices: [
            { label: "turn back inside", next: "continueHall", stat:'grief', statInc:1 },
            { label: "stay a while", next: "stayWindow", stat:'hope', statInc:1 }
          ]
        },
        stayWindow: {
          defaultText: "You stay at the window until dusk. The static sky turns purple, then navy. Stars appear—not real stars, but points of hope that you placed there yourself, long ago.",
          choices: [
            { label: "go back inside", next: "continueHall", stat:'hope', statInc:1 }
          ]
        },
        callOut: {
          defaultText: "Your voice disappears into the static. After a long pause, the figure in the field stops and seems to turn toward you. You can't tell if it's human.",
          choices: [
            { label: "call again", next: "callAgain", stat:'hope', statInc:1 },
            { label: "close the window", next: "continueHall", stat:'grief', statInc:1 }
          ]
        },
        callAgain: {
          defaultText: "You call again and the figure raises an arm. It might be a greeting or a warning. The static between you seems to thin, and for a second you see a face—tired, kind, familiar.",
          choices: [
            { label: "wave back", next: "waveBack", stat:'hope', statInc:2 },
            { label: "turn away", next: "continueHall", stat:'grief', statInc:1 }
          ]
        },
        waveBack: {
          defaultText: "You wave. The figure waves back, then turns and walks away into the static. You feel a pang of loss, but also a strange certainty you will meet again.",
          choices: [
            { label: "turn back to the hallway", next: "continueHall", stat:'hope', statInc:1 }
          ]
        },
        outside: {
          defaultText: "You climb through the window into the static. The ground under your feet is real, asphalt and weeds. The sky is a pale, hesitant blue. In the distance, a city skyline smokes gently.",
          choices: [
            { label: "walk toward the city", next: "cityWalk", stat:'hope', statInc:2 },
            { label: "stand still", next: "outsideStill", stat:'surrender', statInc:1 }
          ]
        },
        outsideStill: {
          defaultText: "You stand still and feel the wind. After a long time, a bird lands on your shoulder. It says nothing, but its presence is a small, perfect warmth.",
          choices: [
            { label: "stay with the bird", next: "birdStay", stat:'hope', statInc:3 },
            { label: "move on", next: "cityWalk", stat:'hope', statInc:1 }
          ]
        },
        birdStay: {
          defaultText: "The bird stays with you until evening, then flies away. In its place, it leaves a small feather. You tuck it into your pocket.",
          choices: [
            { label: "walk on", next: "cityWalk", stat:'hope', statInc:2 }
          ]
        },
        cityWalk: {
          defaultText: "You walk toward the city. The static recedes and becomes grass under your feet. The skyline resolves into familiar shapes—a church, a library, a bakery. It's morning.",
          choices: [
            { label: "enter the bakery", next: "bakery", stat:'hope', statInc:2 },
            { label: "keep walking", next: "cityStreet", stat:'curiosity', statInc:1 }
          ]
        },
        bakery: {
          defaultText: "The bakery smells of fresh bread and cinnamon. The baker, an old woman with kind eyes, hands you a warm roll. 'You look like you've been walking a long time.'",
          choices: [
            { label: "eat the bread", next: "eatBread", stat:'hope', statInc:3 }
          ]
        },
        eatBread: {
          defaultText: "The bread is still warm. You eat it in the bakery doorway, watching the morning light turn the street gold. The baker pats your shoulder. 'You'll be okay.'",
          choices: [
            { label: "believe her", next: "cityStreet", stat:'hope', statInc:3 }
          ]
        },
        cityStreet: {
          defaultText: "The street is empty and quiet. A tram rumbles in the distance. You sit on a bench and watch the world wake up. You made it.",
          choices: [
            { label: "rest", next: "restCity", stat:'hope', statInc:4 }
          ]
        },
        restCity: {
          defaultText: "You find a small park and lie in the grass. The sun is high now. You hear children laughing somewhere. It's a good sound.",
          choices: [
            { label: "close your eyes", next: "restHere", stat:'hope', statInc:4 }
          ]
        },
        silenceRoom: {
          textVariants: {
            musicRoom: "The silence that follows is heavy, like a blanket over the world. The radio is dead. You hear your own heartbeat for the first time in what feels like years.",
            radioDial: "You click the radio off. The silence rushes in like water. The room grows darker, but you can still hear the three notes echoing in your bones."
          },
          defaultText: "The silence that follows is heavy. You hear your own heartbeat. The room grows darker.",
          choices: [
            { label: "stay in the silence", next: "sitWall", stat:'surrender', statInc:1 },
            { label: "feel your way along the wall", next: "darkHallway", stat:'grief', statInc:1 },
            { label: "light a match (you find one in your pocket)", next: "matchLight", stat:'hope', statInc:1 }
          ]
        },
        matchLight: {
          defaultText: "The match flares and you see you are in a small room lined with bookshelves. The books have no titles, just dates. One of them is your birthday.",
          choices: [
            { label: "open the book", next: "openBook", stat:'curiosity', statInc:2 },
            { label: "blow out the match", next: "darkHallway", stat:'surrender', statInc:1 }
          ]
        },
        openBook: {
          defaultText: "The book opens to a page that says only: 'you were always going to end up here.' Handwriting crowds the margins, different colors, different hands. They all seem to be talking to you.",
          choices: [
            { label: "add your own note", next: "addNote", stat:'surrender', statInc:1 },
            { label: "close the book", next: "darkHallway", stat:'hope', statInc:1 }
          ]
        },
        addNote: {
          defaultText: "You write: 'there is still honey.' The margins crowd tighter, but the book seems to sigh, satisfied. You feel a sense of completion.",
          choices: [
            { label: "close the book and continue", next: "darkHallway", stat:'hope', statInc:1 }
          ]
        },
        darkHallway: {
          textVariants: {
            silenceRoom: "The darkness is complete, but you can feel the walls with your fingertips. They are warm and smooth, like the inside of a throat.",
            matchLight: "The match dies and darkness returns, thicker than before. But you remember the way the books looked at you.",
            continueHall: "You turn a corner and the lights fail. The darkness here is different—it has texture, like velvet."
          },
          defaultText: "The darkness is complete, but you can feel the walls with your fingertips. They are warm and smooth.",
          choices: [
            { label: "keep walking", next: "deepDark", stat:'grief', statInc:1 },
            { label: "stop and wait", next: "waitDark", stat:'surrender', statInc:1 },
            { label: "try to go back", next: "returnToHall", stat:'hope', statInc:1 }
          ]
        },
        deepDark: {
          defaultText: "You walk until the darkness becomes a texture. You feel carvings under your fingers: words, maps, equations. The building is writing its own story on its skin.",
          choices: [
            { label: "trace the carvings", next: "traceCarvings", stat:'curiosity', statInc:1 },
            { label: "keep walking", next: "deeperDark", stat:'grief', statInc:2 }
          ]
        },
        deeperDark: {
          defaultText: "The darkness becomes so complete you can't even see your own hands. But you hear water dripping, and you feel a cool breeze. You must be near an exit.",
          choices: [
            { label: "follow the breeze", next: "followBreeze", stat:'hope', statInc:2 },
            { label: "sit and wait for dawn", next: "waitDawn", stat:'surrender', statInc:2 }
          ]
        },
        followBreeze: {
          defaultText: "You follow the breeze until you see a crack of light. You push through and emerge onto a hillside overlooking a valley. It's dawn.",
          choices: [
            { label: "stand and watch", next: "valleyDawn", stat:'hope', statInc:3 }
          ]
        },
        valleyDawn: {
          defaultText: "You stand and watch the valley fill with light. A river glints below. You see a small cottage with smoke rising from its chimney. It looks like home.",
          choices: [
            { label: "go to the cottage", next: "cottage", stat:'hope', statInc:5 }
          ]
        },
        cottage: {
          defaultText: "You reach the cottage. The door is open. Inside, a fire burns, and someone has set the table for one. There's a note: 'welcome home.'",
          choices: [
            { label: "step inside", next: "homeAtLast", stat:'hope', statInc:10 }
          ]
        },
        waitDawn: {
          defaultText: "You wait. Slowly, the darkness thins. You realize you can see your hands again, and then the walls, and then a window you never noticed before. It's open.",
          choices: [
            { label: "climb through", next: "outside", stat:'hope', statInc:3 }
          ]
        },
        waitDark: {
          defaultText: "You wait. After a long time, you notice a faint phosphorescence on the walls. Shapes appear: a chair, a window, a cup. They flicker in and out of existence.",
          choices: [
            { label: "touch a shape", next: "touchShape", stat:'curiosity', statInc:1 },
            { label: "close your eyes", next: "dreamSequence", stat:'surrender', statInc:2 }
          ]
        },
        touchShape: {
          defaultText: "You touch the shape of a cup. It solidifies into a small, clay vessel filled with cool water. You drink, and it tastes of mountains.",
          choices: [
            { label: "keep the cup", next: "keepCup", stat:'hope', statInc:1 },
            { label: "set it down", next: "waitDark", stat:'surrender', statInc:1 }
          ]
        },
        keepCup: {
          defaultText: "You put the cup in your pocket. It will refill whenever you are thirsty. This is one of the building's small mercies.",
          choices: [
            { label: "continue", next: "darkHallway", stat:'hope', statInc:1 }
          ]
        },
        traceCarvings: {
          defaultText: "Under your fingers you read: 'I was here, and I was lost, and I was found, and I was lost again, and I left this mark so you would know you are not the first.'",
          choices: [
            { label: "add your mark", next: "addMark", stat:'surrender', statInc:1 },
            { label: "keep walking", next: "deeperDark", stat:'grief', statInc:1 }
          ]
        },
        addMark: {
          defaultText: "You scratch your name beside the others. The wall grows warmer, and you hear a chorus of sighs, as if the building itself is relieved.",
          choices: [
            { label: "continue", next: "deeperDark", stat:'hope', statInc:1 }
          ]
        },
        staircaseDown: {
          textVariants: {
            start: "The stairs are metal and they sing under your weight. Each step takes you deeper into a smell like wet earth and old photographs.",
            continueHall: "You find the staircase again. The handwriting on the walls has changed—it now includes your own name, half-erased."
          },
          defaultText: "The stairs descend. Handwriting crowds the walls.",
          choices: [
            { label: "try to read the writing", next: "readWallWriting", stat:'curiosity', statInc:2 },
            { label: "descend faster", next: "deepStairs", stat:'grief', statInc:1 },
            { label: "turn back", next: "returnToHall", stat:'hope', statInc:1 },
            { label: "sit on a step", next: "stepBreathe", stat:'surrender', statInc:1 }
          ]
        },
        readWallWriting: {
          defaultText: "The handwriting is small, frantic: 'the map folded itself again.' 'there is a garden in the space between breaths.' 'turn back before the walls learn your name.'",
          choices: [
            { label: "copy a phrase onto your hand", next: "phraseOnHand", stat:'surrender', statInc:1 },
            { label: "follow the writing further down", next: "deepStairs", stat:'curiosity', statInc:1 },
            { label: "scratch your own name beside them", next: "writeName", stat:'grief', statInc:2 }
          ]
        },
        phraseOnHand: {
          defaultText: "'the map folded itself again' is now written on your palm. The ink tingles. You feel a strange certainty that you've been here before.",
          choices: [
            { label: "clench your fist", next: "fistClench", stat:'hope', statInc:1 },
            { label: "keep descending", next: "deepStairs", stat:'grief', statInc:1 }
          ]
        },
        fistClench: {
          defaultText: "You make a fist and the words on your palm press into your skin. When you open your hand, they are gone, but you can still feel them, like a promise.",
          choices: [
            { label: "continue", next: "deepStairs", stat:'hope', statInc:1 }
          ]
        },
        writeName: {
          defaultText: "You scratch your name beside the others. The wall grows warmer, and you hear a chorus of sighs, as if the building itself is relieved.",
          choices: [
            { label: "continue down", next: "deepStairs", stat:'surrender', statInc:1 },
            { label: "turn back", next: "returnToHall", stat:'hope', statInc:1 }
          ]
        },
        deepStairs: {
          textVariants: {
            staircaseDown: "The stairs go deeper than you thought possible. The air becomes thick, and you hear the sound of a cello playing a single sustained note.",
            readWallWriting: "The handwriting leads you further down. The cello note is louder now, vibrating through the concrete."
          },
          defaultText: "The stairs go deeper. A cello note resonates from below.",
          choices: [
            { label: "follow the note", next: "celloRoom", stat:'curiosity', statInc:2 },
            { label: "go back up", next: "staircaseUp", stat:'hope', statInc:1 },
            { label: "stop and let the note wash over you", next: "celloStill", stat:'surrender', statInc:1 }
          ]
        },
        celloRoom: {
          defaultText: "You find the cello: an instrument playing itself in a dusty room. A metronome ticks beside it, set to 60 beats per minute. The note is D, endlessly sustained.",
          choices: [
            { label: "sit and listen", next: "celloStill", stat:'surrender', statInc:2 },
            { label: "try to play a different note", next: "playNote", stat:'curiosity', statInc:1 }
          ]
        },
        celloStill: {
          defaultText: "Time slows. The note becomes your heartbeat. You feel the presence of everyone who has ever sat in this room, waiting. It is a vast, gentle sadness.",
          choices: [
            { label: "close your eyes", next: "dreamSequence", stat:'surrender', statInc:2 },
            { label: "stand up", next: "continueHall", stat:'hope', statInc:1 }
          ]
        },
        playNote: {
          defaultText: "You draw the bow across a different string. The note is a C, high and sweet. The cello accepts it, and now both notes ring together, a chord of dissonant hope.",
          choices: [
            { label: "play more", next: "playMore", stat:'hope', statInc:2 },
            { label: "let it be", next: "celloStill", stat:'surrender', statInc:1 }
          ]
        },
        playMore: {
          defaultText: "You play a melody you didn't know you knew. The cello answers, and together you build a house of sound in the dusty air.",
          choices: [
            { label: "stay in the music", next: "stayMusic", stat:'hope', statInc:3 }
          ]
        },
        stayMusic: {
          defaultText: "You stay in the music until you become a note yourself, suspended in the air of the room, vibrating with a gentle, endless hope.",
          choices: [
            { label: "let go", next: "continueHall", stat:'hope', statInc:2 }
          ]
        },
        staircaseUp: {
          defaultText: "You climb and climb, but the staircase doesn't end. The walls change from concrete to plaster, then to wallpaper, then to bare brick. You hear faint laughter.",
          choices: [
            { label: "keep climbing", next: "endlessUp", stat:'hope', statInc:1 },
            { label: "step off at the next door", next: "unknownDoor", stat:'curiosity', statInc:2 }
          ]
        },
        endlessUp: {
          defaultText: "The stairs never end, but you notice the walls are covered in murals now: green hills, rivers, entire cities painted in vivid detail. Someone spent a lifetime here.",
          choices: [
            { label: "study the murals", next: "studyMurals", stat:'curiosity', statInc:2 },
            { label: "keep climbing", next: "climbForever", stat:'hope', statInc:1 }
          ]
        },
        studyMurals: {
          defaultText: "The murals tell a story: a group of people built a house that kept growing, so they planted gardens in the new rooms and never stopped.",
          choices: [
            { label: "look for the gardens", next: "searchGardenWall", stat:'hope', statInc:2 }
          ]
        },
        climbForever: {
          defaultText: "You climb until your legs are memory, until the stairs become a ladder, until you break through a trapdoor into a room full of morning light.",
          choices: [
            { label: "stand in the light", next: "standLight", stat:'hope', statInc:3 }
          ]
        },
        unknownDoor: {
          defaultText: "The door opens into a library with a high ceiling and a skylight full of stars. A fire crackles in a grate. An armchair waits.",
          choices: [
            { label: "sit and rest", next: "libraryRest", stat:'hope', statInc:3 },
            { label: "browse the shelves", next: "browseLibrary", stat:'curiosity', statInc:2 }
          ]
        },
        libraryRest: {
          defaultText: "You sink into the armchair. The fire crackles. A book lies open on the side table: 'A History of Lost Hallways.' You fall asleep reading.",
          choices: [
            { label: "wake and continue", next: "continueHall", stat:'hope', statInc:2 }
          ]
        },
        browseLibrary: {
          defaultText: "The shelves contain every book ever written about hallways. You pull one out at random: it's your own journal, written in your handwriting, detailing this very journey.",
          choices: [
            { label: "read it", next: "readJournal", stat:'curiosity', statInc:2 }
          ]
        },
        readJournal: {
          defaultText: "The journal describes your journey so far, but the handwriting changes near the end: 'you are almost at the garden. keep going.'",
          choices: [
            { label: "follow the advice", next: "searchGardenWall", stat:'hope', statInc:2 }
          ]
        },
        stepBreathe: {
          defaultText: "You sit on a cold step. After a long moment, you notice a tiny plant growing through a crack in the concrete, pale green and trembling.",
          choices: [
            { label: "touch the plant", next: "touchPlant", stat:'hope', statInc:2 },
            { label: "keep sitting", next: "sitLonger", stat:'surrender', statInc:1 },
            { label: "stand and continue", next: "deepStairs", stat:'grief', statInc:1 }
          ]
        },
        touchPlant: {
          defaultText: "The plant's leaves curl around your finger. It whispers in a voice like wind: 'there is still honey in the broken hive.'",
          choices: [
            { label: "believe it", next: "believePlant", stat:'hope', statInc:2 },
            { label: "pull away", next: "continueHall", stat:'grief', statInc:1 }
          ]
        },
        believePlant: {
          defaultText: "You believe it. The plant straightens, and a tiny flower opens, white and impossibly bright. The staircase fills with the scent of jasmine.",
          choices: [
            { label: "continue down, carrying the scent", next: "deepStairs", stat:'hope', statInc:1 }
          ]
        },
        sitLonger: {
          defaultText: "You sit until your legs go numb. The step becomes softer, and you notice you are no longer on a staircase but on a mossy slope. The ceiling above is a canopy of leaves.",
          choices: [
            { label: "stand in this new place", next: "forestRoom", stat:'hope', statInc:2 },
            { label: "lie down", next: "lieDown", stat:'surrender', statInc:2 }
          ]
        },
        forestRoom: {
          defaultText: "You stand in a room that is also a forest. Trees grow through the floor, their branches pushing against the ceiling. Birds sing, and you see a path leading deeper.",
          choices: [
            { label: "follow the path", next: "forestPath", stat:'hope', statInc:2 },
            { label: "climb a tree", next: "climbTree", stat:'curiosity', statInc:1 }
          ]
        },
        forestPath: {
          defaultText: "The path leads to a clearing where a picnic is laid out. Sandwiches, a thermos of soup, a note that says 'for the one who kept walking.'",
          choices: [
            { label: "eat", next: "eatPicnic", stat:'hope', statInc:2 },
            { label: "leave it for someone else", next: "continueHall", stat:'hope', statInc:1 }
          ]
        },
        eatPicnic: {
          defaultText: "The food is simple and good. The soup is still warm. You eat slowly, savoring each bite. When you finish, you feel ready to go on.",
          choices: [
            { label: "continue", next: "continueHall", stat:'hope', statInc:1 }
          ]
        },
        climbTree: {
          defaultText: "You climb and break through the canopy into a twilight sky full of constellations you don't recognize. You are no longer in the building.",
          choices: [
            { label: "climb back down", next: "forestRoom", stat:'hope', statInc:1 }
          ]
        },
        lieDown: {
          defaultText: "You lie down on the mossy slope. The ground holds you like a cupped hand. You feel roots growing beneath you, connecting you to something vast and alive.",
          choices: [
            { label: "rest here a while", next: "restForest", stat:'surrender', statInc:2 },
            { label: "get up eventually", next: "forestRoom", stat:'hope', statInc:1 }
          ]
        },
        restForest: {
          defaultText: "You rest. The forest holds you. When you wake, a rabbit is watching you, unafraid. It hops away slowly, as if inviting you to follow.",
          choices: [
            { label: "follow the rabbit", next: "followRabbit", stat:'curiosity', statInc:2 }
          ]
        },
        followRabbit: {
          defaultText: "The rabbit leads you to a small hollow under a tree. Inside, a nest of baby rabbits. You watch them breathe, tiny and perfect.",
          choices: [
            { label: "stay and watch", next: "stayWatchRabbits", stat:'hope', statInc:2 }
          ]
        },
        stayWatchRabbits: {
          defaultText: "You watch the rabbits until the light fades. They sleep, trusting. You feel a peace you thought you'd forgotten.",
          choices: [
            { label: "continue when ready", next: "continueHall", stat:'hope', statInc:2 }
          ]
        },
        sitWall: {
          textVariants: {
            start: "You press your back against the wall and the plaster gives slightly, warm like skin. You close your eyes and see a child's drawing of a door.",
            silenceRoom: "You sit in the silence, back to the wall. The plaster is warmer now. You feel a pulse beneath the surface."
          },
          defaultText: "You press your back against the wall. The plaster gives slightly, warm like skin.",
          choices: [
            { label: "press harder", next: "wallOpens", stat:'surrender', statInc:2 },
            { label: "open your eyes", next: "hallwayChanged", stat:'curiosity', statInc:1 },
            { label: "whisper to the wall", next: "wallWhisper", stat:'grief', statInc:1 }
          ]
        },
        wallOpens: {
          defaultText: "The plaster gives way and your hand slips through into a void. You feel a breeze and hear birdsong, impossibly clear. The wall is not a wall anymore.",
          choices: [
            { label: "step through", next: "voidGarden", stat:'hope', statInc:3 },
            { label: "pull your hand back", next: "hallwayChanged", stat:'grief', statInc:1 }
          ]
        },
        voidGarden: {
          textVariants: {
            wallOpens: "You step through and find yourself in a garden surrounded by impossible architecture. Flowers grow out of brickwork. The sky is a soft, perpetual twilight.",
            searchGardenWall: "You find the garden at last. Flowers nod in a breeze that shouldn't exist. The walls here are made of light."
          },
          defaultText: "You are in a garden where flowers grow from brickwork and the sky is perpetual twilight.",
          choices: [
            { label: "explore the garden", next: "exploreGarden", stat:'hope', statInc:2 },
            { label: "look back", next: "lookBackVoid", stat:'grief', statInc:1 }
          ]
        },
        exploreGarden: {
          defaultText: "The garden unfolds in impossible geometries. Paths loop back on themselves. You find a bench with a plaque: 'for those who kept walking.' You sit.",
          choices: [
            { label: "rest", next: "gardenRest", stat:'hope', statInc:2 },
            { label: "look for an exit", next: "gardenExit", stat:'curiosity', statInc:1 }
          ]
        },
        gardenRest: {
          defaultText: "You rest on the bench. Time passes, but you don't age. The garden hums a low, contented note. You realize you could stay here forever.",
          choices: [
            { label: "stay a while longer", next: "stayGarden", stat:'hope', statInc:2 },
            { label: "get up eventually", next: "gardenExit", stat:'hope', statInc:0 }
          ]
        },
        stayGarden: {
          defaultText: "You stay. Days pass. Flowers bloom and die and bloom again. You plant a seed of your own and water it with a cup you found in the dark.",
          choices: [
            { label: "when it blooms, you know what to do", next: "dirtRoad", stat:'hope', statInc:4 }
          ]
        },
        gardenExit: {
          defaultText: "You look for an exit and find one: a small wooden gate covered in ivy. Beyond it, a dirt road. You can smell rain on the wind.",
          choices: [
            { label: "go through", next: "dirtRoad", stat:'hope', statInc:3 }
          ]
        },
        lookBackVoid: {
          defaultText: "You look back and the wall is gone. Only the garden remains, stretching forever. You realize you are no longer in the building. You are somewhere else entirely.",
          choices: [
            { label: "accept this", next: "gardenAccept", stat:'hope', statInc:3 },
            { label: "search for the way back", next: "searchBack", stat:'grief', statInc:1 }
          ]
        },
        gardenAccept: {
          defaultText: "You accept this new place. The garden widens, and you see other wanderers tending flowers. They wave. One of them is you, from a long time ago.",
          choices: [
            { label: "join them", next: "joinGarden", stat:'hope', statInc:4 }
          ]
        },
        joinGarden: {
          defaultText: "You join your other selves in the garden. Together, you tend the flowers and tell stories of the hallways you walked. The sun never sets, but you don't mind.",
          choices: [
            { label: "rest", next: "restForever", stat:'hope', statInc:5 }
          ]
        },
        searchBack: {
          defaultText: "You search for the wall but it's gone. A voice says: 'you can't go back, but you can go forward.' You see a path leading out of the garden.",
          choices: [
            { label: "take the path", next: "gardenExit", stat:'hope', statInc:1 }
          ]
        },
        hallwayChanged: {
          defaultText: "When you open your eyes, the hallway is longer, narrower. The ceiling is lower. You notice that the floor has a slight tilt to the left, as if the whole building is listing.",
          choices: [
            { label: "follow the tilt", next: "tiltingHall", stat:'curiosity', statInc:1 },
            { label: "try to straighten yourself", next: "sitWall", stat:'surrender', statInc:1 }
          ]
        },
        tiltingHall: {
          defaultText: "The tilt increases until you are walking on the wall as much as the floor. Gravity becomes a suggestion. You see doorways above you, upside down.",
          choices: [
            { label: "climb toward a doorway", next: "upsidedownRoom", stat:'curiosity', statInc:2 },
            { label: "let yourself fall", next: "fallDirection", stat:'surrender', statInc:2 }
          ]
        },
        upsidedownRoom: {
          defaultText: "You pull yourself into an upside‑down room. Furniture clings to the ceiling. A window looks down onto the hallway you just left, far below. It feels like flying.",
          choices: [
            { label: "open the upside‑down window", next: "openUpsideWindow", stat:'hope', statInc:2 },
            { label: "sit on the ceiling", next: "sitCeiling", stat:'surrender', statInc:1 }
          ]
        },
        openUpsideWindow: {
          defaultText: "You open the window and fall upward into a sky full of paper birds. They carry you gently toward a floating island with a single tree.",
          choices: [
            { label: "land on the island", next: "floatingIsland", stat:'hope', statInc:3 }
          ]
        },
        floatingIsland: {
          defaultText: "The tree on the island is covered in paper birds. They rustle in the breeze, and each one is a letter from someone who got lost and was found. One is addressed to you.",
          choices: [
            { label: "read it", next: "readLetter", stat:'hope', statInc:3 }
          ]
        },
        readLetter: {
          defaultText: "The letter says: 'we were lost, but we built gardens. we were scared, but we sang. we were alone, but we found each other. you will too.'",
          choices: [
            { label: "tuck the letter away", next: "floatingIslandStay", stat:'hope', statInc:3 }
          ]
        },
        floatingIslandStay: {
          defaultText: "You stay on the island, watching the paper birds circle. The world below is a map of places you've been. You can see the whole labyrinth from here.",
          choices: [
            { label: "descend gently", next: "continueHall", stat:'hope', statInc:2 }
          ]
        },
        sitCeiling: {
          defaultText: "You sit cross-legged on the ceiling. The room below you is a perfect mirror of itself. You feel suspended between two worlds, perfectly balanced.",
          choices: [
            { label: "stay", next: "balanceStay", stat:'surrender', statInc:2 }
          ]
        },
        balanceStay: {
          defaultText: "You stay suspended between the two rooms. The balance becomes a peace. You realize you can be both lost and found at the same time.",
          choices: [
            { label: "descend gently", next: "continueHall", stat:'hope', statInc:2 }
          ]
        },
        fallDirection: {
          defaultText: "You let go and fall, but it's slow, like sinking through water. The hallway twists around you. You land softly in a room with a large, circular rug.",
          choices: [
            { label: "stand up", next: "circularRugRoom", stat:'curiosity', statInc:2 }
          ]
        },
        circularRugRoom: {
          defaultText: "The rug is a map of the world, but the continents are wrong—they spell out a sentence: 'we built this place so the lost would have somewhere to go.'",
          choices: [
            { label: "step on the rug", next: "rugActivate", stat:'curiosity', statInc:2 }
          ]
        },
        rugActivate: {
          defaultText: "You step onto the rug and the world shifts. You are standing in a vast hall with a map on the floor. All the lost hallways connect here.",
          choices: [
            { label: "explore the hub", next: "hubExploration", stat:'curiosity', statInc:2 }
          ]
        },
        hubExploration: {
          defaultText: "The hub connects all hallways. You see doorways labeled with emotions: Nostalgia, Longing, Quiet Joy, Gentle Grief. You can go anywhere now.",
          choices: [
            { label: "choose a door", next: "chooseDoor", stat:'hope', statInc:3 }
          ]
        },
        chooseDoor: {
          defaultText: "You step through a door at random and find yourself... back in the hallway. But it's different now. The walls are the color of dawn.",
          choices: [
            { label: "continue", next: "continueHall", stat:'hope', statInc:2 }
          ]
        },
        wallWhisper: {
          defaultText: "You lean close and whisper a name. The wall whispers it back, but stretched into a long, low sigh. You feel something shift deep within the building.",
          choices: [
            { label: "whisper again", next: "whisperAgain", stat:'surrender', statInc:2 },
            { label: "press your ear to it", next: "wallHeartbeat", stat:'curiosity', statInc:1 },
            { label: "pull away", next: "continueHall", stat:'grief', statInc:1 }
          ]
        },
        whisperAgain: {
          defaultText: "You whisper again, and this time the wall answers in a language you don't understand but feel in your bones. It tells you the history of every lost thing in the building.",
          choices: [
            { label: "ask about the gardens", next: "gardenStory", stat:'hope', statInc:1 },
            { label: "ask about yourself", next: "selfStory", stat:'curiosity', statInc:2 }
          ]
        },
        gardenStory: {
          defaultText: "The wall tells you the gardens were planted by people who got lost and decided to stay. They grew flowers from their memories and watered them with hope.",
          choices: [
            { label: "ask to see them", next: "wallOpens", stat:'hope', statInc:3 }
          ]
        },
        selfStory: {
          defaultText: "The wall tells you that you have been here before, many times, in many forms. You always leave something behind. This time, you left a question.",
          choices: [
            { label: "ask what the question was", next: "questionAsked", stat:'curiosity', statInc:2 },
            { label: "thank it and move on", next: "continueHall", stat:'hope', statInc:1 }
          ]
        },
        questionAsked: {
          defaultText: "The wall says you asked: 'is there still honey in the broken hive?' The answer is yes. There always was.",
          choices: [
            { label: "smile", next: "continueHall", stat:'hope', statInc:2 }
          ]
        },
        wallHeartbeat: {
          defaultText: "You press your ear to the wall and hear a slow, rhythmic beating. It's not your heart. It's the building's. You realise it has been beating this whole time.",
          choices: [
            { label: "stay with the heartbeat", next: "heartbeatStay", stat:'surrender', statInc:2 },
            { label: "move on", next: "continueHall", stat:'hope', statInc:1 }
          ]
        },
        heartbeatStay: {
          defaultText: "You sit with the heartbeat. It slows until it matches your own. You feel the building breathe with you, and for a moment you are not alone.",
          choices: [
            { label: "whisper thank you", next: "whisperThanks", stat:'hope', statInc:1 },
            { label: "stand up", next: "continueHall", stat:'hope', statInc:0 }
          ]
        },
        whisperThanks: {
          defaultText: "You whisper 'thank you.' The building seems to hold its breath, then a warm draft sweeps through the hallway, carrying the scent of jasmine.",
          choices: [
            { label: "continue", next: "continueHall", stat:'hope', statInc:1 }
          ]
        },
        doorNoHandle: {
          defaultText: "The door is smooth and cold. No handle, no keyhole. But you notice a thin crack at the bottom, and through it comes a light that smells like morning.",
          choices: [
            { label: "push it", next: "pushDoor", stat:'hope', statInc:2 },
            { label: "speak to it", next: "speakDoor", stat:'grief', statInc:1 },
            { label: "search for a hidden mechanism", next: "searchDoor", stat:'curiosity', statInc:1 },
            { label: "leave it and walk on", next: "continueHall", stat:'hope', statInc:0 }
          ]
        },
        pushDoor: {
          defaultText: "The door swings open onto a room full of morning light. The windows are open and a breeze stirs dust motes. In the corner, a record player spins silently.",
          choices: [
            { label: "put the needle down", next: "recordPlay", stat:'hope', statInc:2 },
            { label: "stand in the light", next: "standLight", stat:'hope', statInc:1 },
            { label: "close the door", next: "continueHall", stat:'grief', statInc:1 }
          ]
        },
        recordPlay: {
          defaultText: "The needle drops and a voice speaks: 'this is the sound of the place where we kept all the mornings we never used.' Music swells, a slow, trembling orchestral piece.",
          choices: [
